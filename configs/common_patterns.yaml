# ============================================================================
# common_patterns.yaml  —  THE REUSABLE KNOWLEDGE LAYER
# ============================================================================
# This is the centerpiece of MigrateForge. Every field-mapping rule we learn
# from a real client migration gets promoted up into this file. New clients
# INHERIT all of this for free and only declare their deltas.
#
# Goal: client #5 reuses ~80% of what we learned from clients 1-4.
# The common-patterns layer is the knowledge base; a client config is the diff.
#
# Each pattern maps many messy real-world source-column names (aliases) onto one
# canonical target field, and optionally attaches a deterministic transform.
# Alias matching is case-insensitive and ignores spaces / underscores / hyphens,
# so "E-mail", "email_address" and "Email Address" all resolve the same way.
# ============================================================================

patterns:
  first_name:
    aliases: [first, firstname, first_name, fname, given, given_name, forename]
    transform: trim

  last_name:
    aliases: [last, lastname, last_name, lname, surname, family_name]
    transform: trim

  email:
    aliases: [email, e-mail, email_address, mail, "email address", contact_email, e_mail]
    transform: lowercase_trim

  join_date:
    aliases: [joined, join_date, signup_date, "date joined", date_joined, created_at, registration_date, member_since, start_date]
    transform: normalize_date

  # A "composite" pattern: one source column that must be split across two
  # target fields. This is the globex case (full_name -> first_name + last_name).
  full_name:
    aliases: [full_name, "full name", fullname, name, contact_name, customer_name]
    split_into:
      first_name: split_first   # everything except the final token
      last_name: split_last     # the final token
