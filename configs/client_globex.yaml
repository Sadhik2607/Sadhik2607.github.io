# Client: GLOBEX  (example client 2)
# Totally different source shape from ACME: one combined full_name column and
# ISO dates. Still lands in the SAME target schema, still reuses the SAME
# common patterns (full_name split, email normalization). The only client-
# specific line is the date dialect + one explicit override to prove the
# override mechanism works.
client: globex
extends: common_patterns

source:
  date_input_format: "%Y-%m-%d"

mapping:
  # Demonstrates a per-client override: GLOBEX exports the email column with an
  # unusual header ("primary_contact") that the shared layer wouldn't catch.
  # We map it explicitly here instead of polluting the global knowledge base.
  primary_contact: email
